name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_HOST: localhost
      RAILS_ENV: test
      SECRET_KEY_BASE: ci-secret-key-base
      KEKA_API_KEY_ENCRYPTION_KEY: ci-keka-encryption-key
      DEVISE_JWT_SECRET_KEY: ci-devise-jwt-secret
      ACTIVE_STORAGE_SERVICE: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: Prepare database
        run: bin/rails db:prepare

      - name: Run Rails tests
        run: bin/rails test

      - name: Run Vitest
        run: yarn test

      - name: Build Vite production assets
        env:
          RAILS_ENV: production
        run: bin/vite build

      - name: Precompile Rails assets
        env:
          RAILS_ENV: production
        run: bin/rails assets:precompile

      - name: Run Brakeman
        run: bundle exec brakeman --no-pager --quiet -i config/brakeman.ignore

      - name: Audit Ruby dependencies
        run: bundle exec bundler-audit check --update

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate OpenAPI and generated contracts
        run: npm run validate:api && npm run generate:api && git diff --exit-code -- src/api/generated.ts

      - name: Typecheck and test mobile
        run: npm run typecheck && npm test

      - name: Run Expo Doctor
        run: npx expo-doctor

      - name: Export Android and iOS bundles
        env:
          EXPO_PUBLIC_API_URL: https://example.invalid/api/v1
        run: npx expo export --platform android --platform ios --output-dir dist

      - name: Audit critical mobile dependencies
        run: npm audit --audit-level=critical

  eas-preview:
    if: github.event_name == 'workflow_dispatch'
    needs: [verify, mobile]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
      EXPO_PUBLIC_API_URL: ${{ secrets.MOBILE_API_URL }}
      EXPO_PUBLIC_WEB_URL: ${{ secrets.MOBILE_WEB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm ci --legacy-peer-deps
      - name: Queue Android and iOS preview builds
        run: npx eas-cli@latest build --profile preview --platform all --non-interactive --no-wait
