name: Deploy Elastic Beanstalk

# CI runs on pushes and PRs. Deploy only the successful main push, never PR code.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eb-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  deployments: write

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    timeout-minutes: 45
    runs-on: ubuntu-latest
    environment: production
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      EB_ENVIRONMENT: ${{ vars.EB_ENVIRONMENT || 'nexus-hub-prod' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: ruby/setup-ruby@v1
      - name: Verify current main commit and successful CI (temporary direct production)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$RELEASE_SHA" = "$main_sha" || { echo 'A newer main commit exists; skipping this stale release'; exit 1; }
          bin/release-gate production --direct-production
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
      - name: Install EB CLI
        run: |
          python -m pip install --upgrade pip
          pip install awsebcli
      - name: Resolve existing public application URL
        id: live
        env:
          CONFIGURED_URL: ${{ vars.RELEASE_BASE_URL }}
        run: |
          live_url="$CONFIGURED_URL"
          if [ -z "$live_url" ]; then
            live_url="$(aws elasticbeanstalk describe-configuration-settings --application-name nexus-hub --environment-name "$EB_ENVIRONMENT" --query "ConfigurationSettings[0].OptionSettings[?Namespace=='aws:elasticbeanstalk:application:environment' && OptionName=='BASE_URL'].Value | [0]" --output text)"
          fi
          test -n "$live_url" && test "$live_url" != None || { echo 'Set BASE_URL on the existing EB environment or RELEASE_BASE_URL in GitHub'; exit 1; }
          printf 'url=%s\n' "$live_url" >> "$GITHUB_OUTPUT"
      - name: Deploy to existing production environment
        run: |
          printf '%s\n' "$RELEASE_SHA" > .release-revision
          eb deploy "$EB_ENVIRONMENT" --region ap-south-1 --timeout 30 --label "github-${RELEASE_SHA::12}"
      - name: Verify live revision and unauthenticated security boundaries
        env:
          RELEASE_BASE_URL: ${{ steps.live.outputs.url }}
          RELEASE_TARGET: production
        run: bin/release-smoke
