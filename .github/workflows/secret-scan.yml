name: Secret scan
on:
  workflow_call:
permissions:
  contents: read
jobs:
  secrets:
    name: Secret history scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history with redacted output
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            zricethezav/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 git /repo --log-opts="--full-history --all --no-textconv --no-ext-diff" --gitleaks-ignore-path=/repo/.gitleaksignore --ignore-gitleaks-allow --redact=100 --no-banner
