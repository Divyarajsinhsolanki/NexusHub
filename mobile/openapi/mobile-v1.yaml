  /workspace_invitations:
    get:
      operationId: listWorkspaceInvitations
      description: Owners and admins can list invitations in their company; raw tokens are never returned.
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: inviteWorkspaceMember
      description: Creates a seven-day email invitation and reserves a seat. Admins cannot grant owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace_invitation]
              properties:
                workspace_invitation:
                  type: object
                  required: [email]
                  properties:
                    email: { type: string, format: email }
                    role_names:
                      type: array
                      items: { type: string, enum: [owner, admin, member, project_manager, team_leader] }
                    project_ids:
                      type: array
                      items: { type: integer }
                    department_id: { type: [integer, "null"] }
      responses:
        "201": { $ref: "#/components/responses/GenericSuccess" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /workspace_invitations/preview:
    post:
      operationId: previewWorkspaceInvitation
      security: []
      description: Previews a valid invitation using the secret email-link token; does not consume it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitation_token]
              properties:
                invitation_token: { type: string }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "422": { $ref: "#/components/responses/Error" }
  /workspace_invitations/accept:
    post:
      operationId: acceptWorkspaceInvitation
      security: []
      description: Single-use token proves mailbox access. New users choose a password. Suspended same-company accounts require their existing password; different-company accounts cannot move.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitation_token, account]
              properties:
                invitation_token: { type: string }
                account:
                  type: object
                  properties:
                    first_name: { type: string }
                    last_name: { type: string }
                    job_title: { type: string }
                    password: { type: string, minLength: 8, writeOnly: true }
                    password_confirmation: { type: string, writeOnly: true }
                    current_password: { type: string, writeOnly: true }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "422": { $ref: "#/components/responses/Error" }
  /workspace_invitations/{id}/resend:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: resendWorkspaceInvitation
      description: Rotates the token and expiry; the old link stops working. One-minute cooldown.
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /workspace_invitations/{id}/revoke:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: revokeWorkspaceInvitation
      description: Invalidates a pending invitation and releases its reserved seat.
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /workspace_memberships/{id}/offboarding:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: previewWorkspaceOffboarding
      description: Owner-only preview of retained data and required ownership transfer.
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: offboardWorkspaceMember
      description: Owner-only, idempotent access removal. Preserves history, revokes credentials and removes project/team/chat access; ownership transfers require an active successor. Media cleanup is reported separately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offboarding]
              properties:
                offboarding:
                  type: object
                  required: [confirmation]
                  properties:
                    confirmation: { type: string, enum: [OFFBOARD] }
                    successor_id: { type: [integer, "null"] }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /workspace_memberships:
    get:
      operationId: listWorkspaceMemberships
      description: Lists memberships in the authenticated account's company. Requires active membership.
      responses:
        "200":
          description: Company memberships
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WorkspaceMembership" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /workspace_memberships/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    patch:
      operationId: updateWorkspaceMembership
      description: Workspace owner only. Role and suspension changes preserve at least one active owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace_membership]
              properties:
                workspace_membership:
                  type: object
                  properties:
                    status: { type: string, enum: [active, suspended] }
                    role_names:
                      type: array
                      items: { type: string, enum: [owner, admin, member, project_manager, team_leader] }
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/WorkspaceMembership" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
