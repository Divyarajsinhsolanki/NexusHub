openapi: 3.1.0
info:
  title: Nexus Hub Mobile API
  version: 1.0.0
  description: Stable Bearer-authenticated contract for the Nexus Hub Android and iOS clients.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /privacy_requests:
    post:
      operationId: submitPrivacyRequest
      security: []
      description: Public intake, including former employees. Records an encrypted request and queues email verification; never discloses account existence or performs account deletion. Rate limited by IP and email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [privacy_request]
              properties:
                privacy_request:
                  type: object
                  required: [email, request_type, details]
                  properties:
                    email: { type: string, format: email, maxLength: 254 }
                    name: { type: string, maxLength: 120 }
                    country: { type: string, maxLength: 100 }
                    details: { type: string, minLength: 1, maxLength: 4000 }
                    request_type:
                      type: string
                      enum: [access, correction, erasure, portability, restriction, objection, consent_withdrawal, complaint, other]
      responses:
        "202": { description: Request recorded; verification email queued. }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /privacy_requests/verify:
    post:
      operationId: verifyPrivacyRequestEmail
      security: []
      description: Explicitly verifies a single-use signed email link; expires after 24 hours. Returns a separate private tracking token. Mailbox verification alone does not authorize disclosure or deletion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "422": { $ref: "#/components/responses/Error" }
  /privacy_requests/status:
    post:
      operationId: trackPrivacyRequest
      security: []
      description: Private capability-token lookup. Returns status, review target and operator response only; no original submission, email or internal notes. Tracking links expire after 30 days. Do not log or persist tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "422": { $ref: "#/components/responses/Error" }
  /mfa:
    get:
      operationId: mfaStatus
      description: Available to restricted password-authenticated sessions before MFA completion.
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      operationId: disableMfa
      description: Current password and recent MFA required. Privileged accounts cannot disable MFA.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "422": { $ref: "#/components/responses/Error" }
  /mfa/setup:
    post:
      operationId: mfaSetup
      description: Authenticator setup. Secrets and recovery codes are returned only when newly created; never cache them. Verification rejects replay and locks after five failures.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string, writeOnly: true }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /mfa/confirm:
    post:
      operationId: mfaConfirm
      description: Authenticator confirm. Secrets and recovery codes are returned only when newly created; never cache them. Verification rejects replay and locks after five failures.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                otp_code: { type: string, writeOnly: true }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /mfa/verify:
    post:
      operationId: mfaVerify
      description: Authenticator verify. Secrets and recovery codes are returned only when newly created; never cache them. Verification rejects replay and locks after five failures.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                otp_code: { type: string, writeOnly: true }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /mfa/recovery:
    post:
      operationId: mfaRecovery
      description: Authenticator recovery. Secrets and recovery codes are returned only when newly created; never cache them. Verification rejects replay and locks after five failures.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string, writeOnly: true }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /support_access_grants:
    get:
      operationId: supportAccessGrants
      description: Owners see company approvals; support administrators see grants assigned to them. Recent MFA required.
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: approveSupportAccess
      description: Company owner approves a specific active platform administrator with MFA for read-only access; recent MFA required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [support_access_grant]
              properties:
                support_access_grant:
                  type: object
                  required: [support_email, reason, resources]
                  properties:
                    support_email: { type: string, format: email }
                    reason: { type: string, minLength: 10, maxLength: 1000 }
                    duration_minutes: { type: integer, minimum: 5, maximum: 60, default: 30 }
                    resources:
                      type: array
                      minItems: 1
                      items: { type: string, enum: [projects, teams, departments] }
      responses:
        "201": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /support_access_grants/{id}/revoke:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: revokeSupportAccess
      description: Company owner revokes the grant immediately; recent MFA required.
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /support_access_grants/{id}/inspect_records:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: inspectSupportRecords
      description: Assigned support administrator only; active grant and recent MFA required. Returns up to 100 explicitly scoped summary records with audited reads, no files or secrets.
      parameters:
        - name: resource
          in: query
          required: true
          schema: { type: string, enum: [projects, teams, departments] }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /billing:
    get:
      operationId: billingStatus
      description: Workspace owner only; demo and impersonated sessions are denied.
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /billing/checkout:
    post:
      operationId: billingCheckout
      description: Workspace owner only; demo and impersonated sessions are denied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, plan_key]
              properties:
                provider: { type: string, enum: [stripe, razorpay] }
                plan_key: { type: string, enum: [growth, enterprise] }
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /billing/refresh:
    post:
      operationId: billingRefresh
      description: Workspace owner only; demo and impersonated sessions are denied.
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /billing/portal:
    post:
      operationId: billingPortal
      description: Workspace owner only; demo and impersonated sessions are denied.
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /billing/cancel:
    post:
      operationId: billingCancel
      description: Workspace owner only; demo and impersonated sessions are denied.
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /account:
    get:
      operationId: accountStatus
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /account/export:
    get:
      operationId: accountExport
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /account/deletion/code:
    post:
      operationId: requestDeletionCode
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /account/deletion:
    post:
      operationId: scheduleAccountDeletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verification_code, confirmation]
              properties:
                verification_code: { type: string, pattern: '^[0-9]{6}$' }
                confirmation: { type: string, enum: [DELETE] }
                successor_id: { type: [integer, 'null'] }
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    delete:
      operationId: cancelAccountDeletion
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /mobile_config:
    get:
      security: []
      operationId: getMobileConfig
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
  /auth/login:
    post:
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth]
              properties:
                auth:
                  type: object
                  required: [email, password]
                  properties:
                    email: { type: string, format: email }
                    password: { type: string, format: password }
                    device_name: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
        "401":
          $ref: "#/components/responses/Error"
  /auth/google:
    post:
      security: []
      operationId: googleLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: { type: string }
                device_name: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
        "401":
          $ref: "#/components/responses/Error"
  /auth/demo:
    post:
      security: []
      operationId: demoLogin
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
        "503":
          $ref: "#/components/responses/Error"
  /auth/signup:
    post:
      security: []
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth]
              properties:
                auth:
                  type: object
                  required: [first_name, last_name, email, password, password_confirmation]
                  properties:
                    company_name: { type: string, description: Name for a newly isolated company workspace }
                    first_name: { type: string }
                    last_name: { type: string }
                    email: { type: string, format: email }
                    password: { type: string, format: password, minLength: 8 }
                    password_confirmation: { type: string, format: password }
      responses:
        "201":
          $ref: "#/components/responses/GenericSuccess"
        "422":
          $ref: "#/components/responses/Error"
  /auth/refresh:
    post:
      security: []
      operationId: refresh
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
        "401":
          $ref: "#/components/responses/Error"
  /auth/password/forgot:
    post:
      security: []
      operationId: forgotPassword
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
  /auth/password/reset:
    post:
      security: []
      operationId: resetPassword
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
        "422":
          $ref: "#/components/responses/Error"
  /auth/password/change:
    patch:
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: object
                  required: [current_password, password, password_confirmation]
                  properties:
                    current_password: { type: string, format: password }
                    password: { type: string, format: password, minLength: 8 }
                    password_confirmation: { type: string, format: password, minLength: 8 }
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
        "422":
          $ref: "#/components/responses/Error"
  /me:
    get:
      operationId: getMe
      responses:
        "200":
          description: Current user and capabilities
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/User"
    patch:
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth]
              properties:
                auth:
                  type: object
                  properties:
                    push_notification_settings:
                      $ref: "#/components/schemas/PushNotificationSettings"
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
  /home:
    get:
      operationId: getHome
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
  /activity:
    get:
      operationId: listActivity
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /daily_momentum:
    get:
      operationId: getDailyMomentum
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /search:
    get:
      operationId: searchWorkspace
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
  /projects:
    get:
      operationId: listProjects
      responses:
        "200":
          description: Paginated projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCollection"
    post:
      operationId: createProject
      responses:
        "201":
          $ref: "#/components/responses/GenericSuccess"
  /projects/{id}/operations:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getProjectOperations
      description: Project operations with server-enforced membership, secret redaction, and revision checks.
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /projects/{id}/operations/history:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getProjectOperationsHistory
      description: Project operations with server-enforced membership, secret redaction, and revision checks.
      parameters:
        - name: before_id
          in: query
          schema: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /projects/{id}/operations/items:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: postProjectOperationsItems
      description: Project operations with server-enforced membership, secret redaction, and revision checks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required: [revision]
              properties:
                revision: { type: integer }
                reason: { type: string, maxLength: 500 }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "201": { $ref: "#/components/responses/GenericSuccess" }
  /projects/{id}/operations/items/{item_id}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: item_id
        in: path
        required: true
        schema: { type: integer }
    patch:
      operationId: patchProjectOperationsItemsItemId
      description: Project operations with server-enforced membership, secret redaction, and revision checks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required: [revision]
              properties:
                revision: { type: integer }
                reason: { type: string, maxLength: 500 }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProjectOperationsItemsItemId
      description: Project operations with server-enforced membership, secret redaction, and revision checks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required: [revision]
              properties:
                revision: { type: integer }
                reason: { type: string, maxLength: 500 }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /projects/{id}/operations/items/{item_id}/entries/{environment_id}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: item_id
        in: path
        required: true
        schema: { type: integer }
      - name: environment_id
        in: path
        required: true
        schema: { type: integer }
    put:
      operationId: putProjectOperationsItemsItemIdEntriesEnvironmentId
      description: Project operations with server-enforced membership, secret redaction, and revision checks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required: [revision]
              properties:
                revision: { type: integer }
                reason: { type: string, maxLength: 500 }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /projects/{id}/operations/deployments:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getProjectOperationsDeployments
      description: Project operations with server-enforced membership, secret redaction, and revision checks.
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: postProjectOperationsDeployments
      description: Project operations with server-enforced membership, secret redaction, and revision checks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required: [revision]
              properties:
                revision: { type: integer }
                reason: { type: string, maxLength: 500 }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "201": { $ref: "#/components/responses/GenericSuccess" }
  /projects/{id}/operations/deployments/{deployment_id}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: deployment_id
        in: path
        required: true
        schema: { type: integer }
    patch:
      operationId: patchProjectOperationsDeploymentsDeploymentId
      description: Project operations with server-enforced membership, secret redaction, and revision checks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required: [revision]
              properties:
                revision: { type: integer }
                reason: { type: string, maxLength: 500 }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProjectOperationsDeploymentsDeploymentId
      description: Project operations with server-enforced membership, secret redaction, and revision checks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required: [revision]
              properties:
                revision: { type: integer }
                reason: { type: string, maxLength: 500 }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /projects/{id}/operations/deployments/{deployment_id}/transition:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: deployment_id
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: postProjectOperationsDeploymentsDeploymentIdTransition
      description: Project operations with server-enforced membership, secret redaction, and revision checks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required: [revision]
              properties:
                revision: { type: integer }
