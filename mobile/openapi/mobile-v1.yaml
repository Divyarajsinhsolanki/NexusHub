openapi: 3.1.0
info:
  title: Nexus Hub Mobile API
  version: 1.0.0
  description: Stable Bearer-authenticated contract for the Nexus Hub Android and iOS clients.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /mobile_config:
    get:
      security: []
      operationId: getMobileConfig
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
  /auth/login:
    post:
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth]
              properties:
                auth:
                  type: object
                  required: [email, password]
                  properties:
                    email: { type: string, format: email }
                    password: { type: string, format: password }
                    device_name: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
        "401":
          $ref: "#/components/responses/Error"
  /auth/google:
    post:
      security: []
      operationId: googleLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: { type: string }
                device_name: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
        "401":
          $ref: "#/components/responses/Error"
  /auth/demo:
    post:
      security: []
      operationId: demoLogin
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
        "503":
          $ref: "#/components/responses/Error"
  /auth/signup:
    post:
      security: []
      operationId: signup
      responses:
        "201":
          $ref: "#/components/responses/GenericSuccess"
        "422":
          $ref: "#/components/responses/Error"
  /auth/refresh:
    post:
      security: []
      operationId: refresh
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
        "401":
          $ref: "#/components/responses/Error"
  /auth/password/forgot:
    post:
      security: []
      operationId: forgotPassword
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
  /auth/password/reset:
    post:
      security: []
      operationId: resetPassword
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
        "422":
          $ref: "#/components/responses/Error"
  /auth/password/change:
    patch:
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: object
                  required: [current_password, password, password_confirmation]
                  properties:
                    current_password: { type: string, format: password }
                    password: { type: string, format: password, minLength: 8 }
                    password_confirmation: { type: string, format: password, minLength: 8 }
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
        "422":
          $ref: "#/components/responses/Error"
  /me:
    get:
      operationId: getMe
      responses:
        "200":
          description: Current user and capabilities
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/User"
    patch:
      operationId: updateMe
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
  /home:
    get:
      operationId: getHome
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
  /activity:
    get:
      operationId: listActivity
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /daily_momentum:
    get:
      operationId: getDailyMomentum
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /search:
    get:
      operationId: searchWorkspace
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
  /projects:
    get:
      operationId: listProjects
      responses:
        "200":
          description: Paginated projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCollection"
    post:
      operationId: createProject
      responses:
        "201":
          $ref: "#/components/responses/GenericSuccess"
  /projects/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getProject
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
    patch:
      operationId: updateProject
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
    delete:
      operationId: deleteProject
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
  /tasks:
    get:
      operationId: listTasks
      parameters:
        - name: project_id
          in: query
          schema: { type: integer }
        - name: sprint_id
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string, enum: [todo, inprogress, completed] }
        - name: type
          in: query
          schema: { type: string, enum: [Code, qa] }
        - name: mine
          in: query
          schema: { type: boolean }
        - name: due_from
          in: query
          schema: { type: string, format: date }
        - name: due_to
          in: query
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Paginated tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskCollection"
    post:
      operationId: createTask
      responses:
        "201":
          $ref: "#/components/responses/GenericSuccess"
  /tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getTask
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
    patch:
      operationId: updateTask
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
    delete:
      operationId: deleteTask
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
  /work_logs:
    get:
      operationId: listWorkLogs
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
    post:
      operationId: createWorkLog
      responses:
        "201":
          $ref: "#/components/responses/GenericSuccess"
  /calendar_events:
    get:
      operationId: listCalendarEvents
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    post:
      operationId: createCalendarEvent
      responses:
        "201": { $ref: "#/components/responses/GenericSuccess" }
  /calendar_events/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateCalendarEvent
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    delete:
      operationId: deleteCalendarEvent
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /calendar_events/{id}/event_reminders:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: createEventReminder
      responses:
        "201": { $ref: "#/components/responses/GenericSuccess" }
  /event_reminders/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateEventReminder
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    delete:
      operationId: deleteEventReminder
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /sprints:
    get:
      operationId: listSprints
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    post:
      operationId: createSprint
      responses:
        "201": { $ref: "#/components/responses/GenericSuccess" }
  /sprints/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateSprint
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    delete:
      operationId: deleteSprint
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /sprints/{id}/import_tasks:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: importSprintTasks
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /sprints/{id}/export_tasks:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: exportSprintTasks
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /sprints/{id}/export_logs:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: exportSprintLogs
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /tasks/import_backlog:
    post:
      operationId: importProjectBacklog
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /posts:
    get:
      operationId: listPosts
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    post:
      operationId: createPost
      responses:
        "201": { $ref: "#/components/responses/GenericSuccess" }
  /posts/{id}/comments:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listPostComments
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    post:
      operationId: createPostComment
      responses:
        "201": { $ref: "#/components/responses/GenericSuccess" }
  /teams:
    get:
      operationId: listTeams
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    post:
      operationId: createTeam
      responses:
        "201": { $ref: "#/components/responses/GenericSuccess" }
  /teams/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateTeam
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    delete:
      operationId: deleteTeam
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /teams/{id}/insights:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getTeamInsights
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /team_users:
    post:
      operationId: createTeamMembership
      responses:
        "201": { $ref: "#/components/responses/GenericSuccess" }
  /team_users/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateTeamMembership
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    delete:
      operationId: deleteTeamMembership
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /skills:
    get:
      operationId: listSkills
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /skill_endorsements:
    post:
      operationId: createSkillEndorsement
      responses:
        "201": { $ref: "#/components/responses/GenericSuccess" }
  /skill_endorsements/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: deleteSkillEndorsement
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /learning_goals:
    get:
      operationId: listLearningGoals
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    post:
      operationId: createLearningGoal
      responses:
        "201": { $ref: "#/components/responses/GenericSuccess" }
  /learning_goals/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateLearningGoal
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    delete:
      operationId: deleteLearningGoal
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /learning_checkpoints:
    post:
      operationId: createLearningCheckpoint
      responses:
        "201": { $ref: "#/components/responses/GenericSuccess" }
  /learning_checkpoints/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateLearningCheckpoint
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    delete:
      operationId: deleteLearningCheckpoint
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /users:
    get:
      operationId: listWorkspaceUsers
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    post:
      operationId: createWorkspaceUser
      responses:
        "201": { $ref: "#/components/responses/GenericSuccess" }
  /departments:
    get:
      operationId: listDepartments
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    post:
      operationId: createDepartment
      responses:
        "201": { $ref: "#/components/responses/GenericSuccess" }
  /departments/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getDepartment
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    patch:
      operationId: updateDepartment
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    delete:
      operationId: deleteDepartment
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /departments/{id}/update_members:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateDepartmentMembers
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /items:
    get:
      operationId: listVaultItems
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    post:
      operationId: createVaultItem
      responses:
        "201": { $ref: "#/components/responses/GenericSuccess" }
  /issues:
    get:
      operationId: listIssues
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    post:
      operationId: createIssue
      responses:
        "201": { $ref: "#/components/responses/GenericSuccess" }
  /issues/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateIssue
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    delete:
      operationId: deleteIssue
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /issues/import_from_sheet:
    post:
      operationId: importIssuesFromSheet
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /knowledge_items:
    get:
      operationId: listKnowledgeItems
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /knowledge_items/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: archiveKnowledgeItem
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /knowledge_bookmarks:
    get:
      operationId: listKnowledgeBookmarks
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    post:
      operationId: createKnowledgeBookmark
      responses:
        "201": { $ref: "#/components/responses/GenericSuccess" }
  /knowledge_bookmarks/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: deleteKnowledgeBookmark
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /knowledge_bookmarks/{id}/mark_reviewed:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: markKnowledgeBookmarkReviewed
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /conversations:
    get:
      operationId: listConversations
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    post:
      operationId: createConversation
      responses:
        "201": { $ref: "#/components/responses/GenericSuccess" }
  /conversations/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listConversationMessages
      parameters:
        - name: before_id
          in: query
          schema: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    post:
      operationId: createConversationMessage
      responses:
        "201": { $ref: "#/components/responses/GenericSuccess" }
  /conversations/{id}/receipt:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateConversationReceipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receipt]
              properties:
                receipt:
                  type: object
                  required: [message_id, state]
                  properties:
                    message_id: { type: integer }
                    state: { type: string, enum: [delivered, read] }
      responses:
        "200":
          description: Monotonic receipt high-water marks for the current participant
          content:
            application/json:
              schema:
                type: object
                required: [receipt]
                properties:
                  receipt:
                    $ref: "#/components/schemas/ConversationReceipt"
        "422": { $ref: "#/components/responses/Error" }
  /conversations/{id}/calls:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: createConversationCall
      responses:
        "201": { $ref: "#/components/responses/GenericSuccess" }
  /calls/{id}/join:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: joinCall
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /calls/{id}/leave:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: leaveCall
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /calls/{id}/end:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: endCall
      description: Ends the call for everyone. Only the initiator may use this action.
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
  /meet/{public_id}:
    parameters:
      - name: public_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getMeeting
      description: Returns call-only metadata without exposing its source conversation.
      responses:
        "200":
          description: Meeting details
          content:
            application/json:
              schema:
                type: object
                required: [call_session]
                properties:
                  call_session:
                    $ref: "#/components/schemas/CallSession"
        "404": { $ref: "#/components/responses/Error" }
  /meet/{public_id}/join:
    parameters:
      - name: public_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: joinMeeting
      description: Idempotently joins an authenticated link holder without granting conversation access.
      responses:
        "200":
          description: LiveKit credentials and personalized call metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveKitCredentials"
        "410": { $ref: "#/components/responses/Error" }
  /notifications:
    get:
      operationId: listNotifications
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
  /mobile_sessions:
    get:
      operationId: listMobileSessions
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
  /mobile_sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: revokeMobileSession
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /impersonation:
    post:
      operationId: startImpersonation
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      operationId: stopImpersonation
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /mobile_device:
    put:
      operationId: registerMobileDevice
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
    delete:
      operationId: unregisterMobileDevice
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
  /realtime/token:
    post:
      operationId: createRealtimeToken
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
  /portfolio:
    get:
      security: []
      operationId: getPublishedPortfolio
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "404": { $ref: "#/components/responses/Error" }
  /demo/manifest:
    get:
      operationId: getDemoManifest
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
  /uploads:
    post:
      operationId: createDirectUpload
      responses:
        "201":
          $ref: "#/components/responses/GenericSuccess"
  /pdf_documents:
    get:
      operationId: listPdfDocuments
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
    post:
      operationId: uploadPdfDocument
      responses:
        "201":
          $ref: "#/components/responses/GenericSuccess"
  /pdf_documents/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getPdfDocument
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    patch:
      operationId: renamePdfDocument
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    delete:
      operationId: deletePdfDocument
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /pdf_document_operations:
    post:
      operationId: createPdfOperation
      responses:
        "201":
          $ref: "#/components/responses/GenericSuccess"
        "202":
          $ref: "#/components/responses/GenericSuccess"
  /pdf_document_operations/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getPdfOperation
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /admin/tables:
    get:
      operationId: listAdminTables
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/meta/{table}:
    parameters:
      - name: table
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getAdminTableMetadata
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/{table}:
    parameters:
      - name: table
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listAdminRecords
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAdminRecord
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/{table}/{id}:
    parameters:
      - name: table
        in: path
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateAdminRecord
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAdminRecord
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /admin/users/{id}/password:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: resetAdminUserPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: object
                  required: [password, password_confirmation]
                  properties:
                    password: { type: string, format: password, minLength: 6 }
                    password_confirmation: { type: string, format: password, minLength: 6 }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /portfolio_admin:
    get:
      operationId: getPortfolioAdmin
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
  /portfolio_admin/profile:
    patch:
      operationId: updatePortfolioProfile
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "422": { $ref: "#/components/responses/Error" }
  /portfolio_admin/projects:
    post:
      operationId: createPortfolioProject
      responses:
        "201": { $ref: "#/components/responses/GenericSuccess" }
        "422": { $ref: "#/components/responses/Error" }
  /portfolio_admin/projects/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updatePortfolioProject
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    delete:
      operationId: deletePortfolioProject
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /portfolio_admin/projects/{id}/features:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: createPortfolioFeature
      responses:
        "201": { $ref: "#/components/responses/GenericSuccess" }
  /portfolio_admin/features/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updatePortfolioFeature
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    delete:
      operationId: deletePortfolioFeature
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
  responses:
    GenericSuccess:
      description: Normalized success response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GenericEnvelope"
    AuthSuccess:
      description: Mobile authentication session
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: "#/components/schemas/AuthSession"
    Error:
      description: Normalized error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    GenericEnvelope:
      type: object
      required: [data]
      properties:
        data: {}
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        next_page: { type: [integer, "null"] }
        total_pages: { type: integer }
        total_count: { type: integer }
        per_page: { type: integer }
      additionalProperties: true
    ConversationReceipt:
      type: object
      required: [conversation_id, user_id]
      properties:
        conversation_id: { type: integer }
        user_id: { type: integer }
        delivered_message_id: { type: [integer, "null"] }
        read_message_id: { type: [integer, "null"] }
        delivered_at: { type: [string, "null"], format: date-time }
        read_at: { type: [string, "null"], format: date-time }
    CallParticipant:
      type: object
      required: [user_id, name, status]
      properties:
        user_id: { type: integer }
        name: { type: string }
        status: { type: string }
        ring_acknowledged_at: { type: [string, "null"], format: date-time }
        joined_at: { type: [string, "null"], format: date-time }
        left_at: { type: [string, "null"], format: date-time }
    CallSession:
      type: object
      required: [id, public_id, share_url, conversation_id, call_type, status, initiator_id, initiator_name, can_end, participants]
      properties:
        id: { type: integer }
        public_id: { type: string, format: uuid }
        share_url: { type: string, format: uri }
        conversation_id: { type: integer }
        call_type: { type: string, enum: [audio, video] }
        status: { type: string }
        initiator_id: { type: integer }
        initiator_name: { type: string }
        can_end: { type: boolean }
        started_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        ended_reason: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }
        current_participant:
          oneOf:
            - $ref: "#/components/schemas/CallParticipant"
            - type: "null"
        participants:
          type: array
          items:
            $ref: "#/components/schemas/CallParticipant"
    LiveKitCredentials:
      type: object
      required: [server_url, participant_token, call_session]
      properties:
        server_url: { type: string, format: uri }
        participant_token: { type: string }
        call_session:
          $ref: "#/components/schemas/CallSession"
    User:
      type: object
      required: [id, email, first_name, last_name, full_name, roles, workspace, permissions, features]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        full_name: { type: string }
        job_title: { type: string }
        profile_picture: { type: [string, "null"] }
        demo_account: { type: boolean }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
        features:
          type: object
          additionalProperties: { type: boolean }
        workspace:
          type: object
          required: [id, name, slug]
          properties:
            id: { type: integer }
            name: { type: string }
            slug: { type: string }
        preferences:
          type: object
          additionalProperties: true
    AuthSession:
      type: object
      required: [user, access_token, refresh_token, access_token_expires_at, refresh_token_expires_at]
      properties:
        user:
          $ref: "#/components/schemas/User"
        access_token: { type: string }
        refresh_token: { type: string }
        access_token_expires_at: { type: integer }
        refresh_token_expires_at: { type: integer }
        impersonating: { type: boolean }
    Project:
      type: object
      required: [id, name, status]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: [string, "null"] }
        status: { type: string }
        start_date: { type: [string, "null"], format: date }
        end_date: { type: [string, "null"], format: date }
        task_count: { type: integer }
        sprint_count: { type: integer }
        sheet_integration_enabled: { type: boolean }
        sheet_id: { type: [string, "null"] }
        issue_sheet_id: { type: [string, "null"] }
        issue_sheet_name: { type: [string, "null"] }
        qa_mode_enabled: { type: boolean }
        users:
          type: array
          items:
            type: object
            additionalProperties: true
    Task:
      type: object
      required: [id, title, type, status]
      properties:
        id: { type: integer }
        task_id: { type: [string, "null"] }
        title: { type: string }
        description: { type: [string, "null"] }
        type: { type: string }
        status: { type: string }
        priority: { type: [string, "null"] }
        start_date: { type: [string, "null"], format: date }
        end_date: { type: [string, "null"], format: date }
        estimated_hours: { type: [number, string, "null"] }
        project_id: { type: [integer, "null"] }
        sprint_id: { type: [integer, "null"] }
        task_url: { type: [string, "null"] }
        order: { type: [integer, "null"] }
        developer_id: { type: [integer, "null"] }
        assigned_to_user: { type: [integer, "null"] }
        qa_assigned: { type: [string, "null"] }
        internal_qa: { type: [string, "null"] }
        blocker: { type: boolean }
        demo: { type: boolean }
        swag_point: { type: [number, string, "null"] }
        story_point: { type: [number, string, "null"] }
        dev_hours: { type: [number, string, "null"] }
        code_review_hours: { type: [number, string, "null"] }
        dev_to_qa_hours: { type: [number, string, "null"] }
        qa_hours: { type: [number, string, "null"] }
        automation_qa_hours: { type: [number, string, "null"] }
        total_hours: { type: [number, string, "null"] }
    ProjectCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    TaskCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
