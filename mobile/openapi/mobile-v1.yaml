  /conversations/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listConversationMessages
      parameters:
        - name: before_id
          in: query
          schema: { type: integer }
        - name: q
          in: query
          description: Literal case-insensitive text or attachment filename search; excludes deleted messages.
          schema: { type: string, maxLength: 200 }
        - name: attachments
          in: query
          description: Only visible messages containing shared attachments of the selected type.
          schema: { type: string, enum: [all, media, files] }
        - name: pinned
          in: query
          description: Return only pinned, visible messages in this conversation.
          schema: { type: boolean }
        - name: thread_id
          in: query
          description: Return the root message and its direct replies, with thread_root in metadata.
          schema: { type: integer }
        - name: around_id
          in: query
          description: Return messages surrounding this message in the current conversation.
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: updated_since
          in: query
          description: Inclusive server timestamp for paginated reconnect recovery, including edits and deletions.
          schema: { type: string, format: date-time }
        - name: after_id
          in: query
          description: Cursor for updated_since recovery.
          schema: { type: integer }
      responses:
        "200":
          description: Message history or matching messages with pagination metadata.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ChatMessage" }
                  meta:
                    type: object
                    properties:
                      has_more: { type: boolean }
                      next_before_id: { type: [integer, 'null'] }
                      next_after_id: { type: [integer, 'null'] }
                      server_time: { type: string, format: date-time }
                      target_id: { type: integer }
                      context: { type: boolean }
                      per_page: { type: integer }
    post:
      operationId: createConversationMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: object
                  required: [body]
                  properties:
                    body: { type: string, maxLength: 4000 }
                    client_id: { type: string, maxLength: 100 }
                    reply_to_id: { type: [integer, 'null'], description: A regular message in the same conversation. }
      responses:
        "201": { $ref: "#/components/responses/GenericSuccess" }
  /conversations/{id}/messages/{message_id}/pin:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: message_id
        in: path
        required: true
        schema: { type: integer }
    patch:
      operationId: pinConversationMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pinned]
              properties:
                pinned: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /conversations/{id}/scheduled_messages:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listScheduledChatMessages
      description: Pending sends owned by the current member; other members cannot access drafts.
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    post:
      operationId: scheduleChatMessage
      description: Persist a send for a future instant, within one year. A client_id makes retries idempotent. Supports attachments through multipart/form-data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: object
                  required: [client_id, send_at]
                  properties:
                    body: { type: string }
                    client_id: { type: string }
                    send_at: { type: string, format: date-time }
                    reply_to_id: { type: [integer, 'null'] }
      responses:
        "201": { $ref: "#/components/responses/GenericSuccess" }
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /conversations/{id}/scheduled_messages/{schedule_id}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: schedule_id
        in: path
        required: true
        schema: { type: integer }
    delete:
      operationId: cancelScheduledChatMessage
      description: Cancel your own pending send. A delivered send returns a conflict.
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "409": { description: Message already sent. }
  /conversations/{id}/messages/{message_id}/link_preview:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: message_id
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getMessageLinkPreview
      description: Cached metadata for the first HTTP link in a visible message. Unsupported sites return an empty object.
      parameters:
        - name: url
          in: query
          required: true
          schema: { type: string, maxLength: 2048 }
      responses:
        "200":
          description: Website metadata when available.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      url: { type: string }
                      title: { type: string }
                      description: { type: string }
                      image: { type: [string, 'null'] }
                      hostname: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /conversations/{id}/messages/{message_id}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: message_id
        in: path
        required: true
        schema: { type: integer }
    patch:
      operationId: editConversationMessage
      description: Author-only text edit strictly before 15 minutes after creation; system and deleted messages cannot be changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: object
                  required: [body]
                  properties:
                    body: { type: string }
      responses:
        "200":
          description: Updated message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteConversationMessage
      description: Author-only deletion strictly before 15 minutes; retains a placeholder and removes content and attachment associations.
      responses:
        "200":
          description: Deleted message placeholder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /conversations/{id}/receipt:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateConversationReceipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receipt]
              properties:
                receipt:
                  type: object
                  required: [message_id, state]
                  properties:
                    message_id: { type: integer }
                    state: { type: string, enum: [delivered, read] }
      responses:
        "200":
          description: Monotonic receipt high-water marks for the current participant
          content:
            application/json:
              schema:
                type: object
                required: [receipt]
                properties:
                  receipt:
                    $ref: "#/components/schemas/ConversationReceipt"
        "422": { $ref: "#/components/responses/Error" }
  /conversations/{id}/calls:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: createConversationCall
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                media_confirmation_required:
                  type: boolean
                  default: false
                  description: Defer joined attendance until the media connection is confirmed. Updated clients send true; omission preserves older client behavior.
      responses:
        "201": { $ref: "#/components/responses/GenericSuccess" }
  /scheduled_meetings:
    get:
      operationId: listScheduledMeetings
      description: Workspace-scoped meetings organized by or inviting the authenticated
        user. Paginated, newest start first.
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Meetings and pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/ScheduledMeeting"
                  meta:
                    "$ref": "#/components/schemas/PaginationMeta"
    post:
      operationId: scheduleMeeting
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 120
                description:
                  type: string
                  maxLength: 5000
                starts_at:
                  type: string
                  format: date-time
                ends_at:
                  type: string
                  format: date-time
                call_type:
                  type: string
                  enum:
                  - audio
                  - video
                invitee_ids:
                  type: array
                  maxItems: 100
                  items:
                    type: integer
                  uniqueItems: true
                lock_version:
                  type: integer
      responses:
        '201':
          "$ref": "#/components/responses/GenericSuccess"
        '422':
          "$ref": "#/components/responses/Error"
  /scheduled_meetings/{id}:
    parameters:
    - "$ref": "#/components/parameters/Id"
    get:
      operationId: getScheduledMeeting
      responses:
        '200':
          "$ref": "#/components/responses/GenericSuccess"
        '404':
          "$ref": "#/components/responses/Error"
    patch:
      operationId: rescheduleMeeting
      description: Organizer only before a room starts. Pass the current lock_version.
        Invitations and calendar reminders are replaced atomically.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 120
                description:
                  type: string
                  maxLength: 5000
                starts_at:
                  type: string
                  format: date-time
                ends_at:
                  type: string
                  format: date-time
                call_type:
                  type: string
                  enum:
                  - audio
                  - video
                invitee_ids:
                  type: array
                  maxItems: 100
                  items:
                    type: integer
                  uniqueItems: true
                lock_version:
                  type: integer
      responses:
        '200':
          "$ref": "#/components/responses/GenericSuccess"
        '404':
          "$ref": "#/components/responses/Error"
        '403':
          "$ref": "#/components/responses/Error"
        '409':
          "$ref": "#/components/responses/Error"
        '422':
          "$ref": "#/components/responses/Error"
  /scheduled_meetings/{id}/cancel:
    parameters:
    - "$ref": "#/components/parameters/Id"
    post:
      operationId: cancelScheduledMeeting
      description: Organizer cancellation disables reminders and ends a live room.
      responses:
        '200':
          "$ref": "#/components/responses/GenericSuccess"
        '404':
          "$ref": "#/components/responses/Error"
        '403':
          "$ref": "#/components/responses/Error"
  /scheduled_meetings/{id}/respond:
    parameters:
    - "$ref": "#/components/parameters/Id"
    post:
      operationId: respondToMeetingInvitation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - response
              properties:
                response:
                  type: string
                  enum:
                  - accepted
                  - declined
      responses:
        '200':
          "$ref": "#/components/responses/GenericSuccess"
        '404':
          "$ref": "#/components/responses/Error"
        '422':
          "$ref": "#/components/responses/Error"
  /scheduled_meetings/{id}/join:
    parameters:
    - "$ref": "#/components/parameters/Id"
    post:
      operationId: openScheduledMeetingRoom
      description: Opens 15 minutes before start. Organizer starts one room; invitees
        can then request host approval.
      responses:
        '200':
          description: Meeting room identifier
          content:
            application/json:
              schema:
                type: object
                properties:
                  public_id:
                    type: string
                    format: uuid
        '422':
          "$ref": "#/components/responses/Error"
  /calls:
    get:
      operationId: listCallHistory
      description: Paginated current-workspace calls in which the authenticated user participated, newest first. Callback availability respects current conversation membership and live calls. Duration is the user's connected time, zero for unanswered calls.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
      responses:
        "200":
          description: Call history with pagination
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CallHistoryEntry" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
        "401": { $ref: "#/components/responses/Error" }
  /calls/{id}/join:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: joinCall
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                media_confirmation_required:
                  type: boolean
                  default: false
                  description: Defer joined attendance until the media connection is confirmed. Updated clients send true; omission preserves older client behavior.
      responses:
        "202": {"description": "Waiting for host approval; no media credentials", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MeetingAdmission"}}}}
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /calls/{id}/host_action:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: moderateCallParticipant
      description: Current host only. Mute microphone tracks, remove a connected participant, or transfer host to a connected participant in the same workspace. Mute never remotely unmutes. Removed participants cannot obtain fresh call credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host_action, user_id]
              properties:
                host_action: { type: string, enum: [mute, remove, transfer_host, approve, reject] }
                user_id: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /calls/{id}/media_heartbeat:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: confirmCallMedia
      description: Confirm the authenticated participant's successful media connection. Does not issue credentials or grant access to new participants.
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /calls/{id}/ack_ring:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: acknowledgeCallRing
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /calls/{id}/decline:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: declineCall
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /calls/{id}/leave:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: leaveCall
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /calls/{id}/end:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: endCall
      description: Ends the call for everyone. Only the initiator may use this action.
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
  /meet/{public_id}:
    parameters:
      - name: public_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getMeeting
      description: Returns call-only metadata without exposing its source conversation.
      responses:
        "200":
          description: Meeting details
          content:
            application/json:
              schema:
                type: object
                required: [call_session]
                properties:
                  call_session:
                    $ref: "#/components/schemas/CallSession"
        "404": { $ref: "#/components/responses/Error" }
  /meet/{public_id}/join:
    parameters:
      - name: public_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: joinMeeting
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                media_confirmation_required:
                  type: boolean
                  default: false
                  description: Defer joined attendance until the media connection is confirmed. Updated clients send true; omission preserves older client behavior.
      description: Idempotently joins an authenticated link holder without granting conversation access.
      responses:
        "202": {"description": "Waiting for host approval; no media credentials", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MeetingAdmission"}}}}
        "200":
          description: LiveKit credentials and personalized call metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveKitCredentials"
        "410": { $ref: "#/components/responses/Error" }
  /notifications:
    get:
      operationId: listNotifications
      responses:
        "200":
          description: Paginated visible in-app notifications
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
                  meta:
                    allOf:
                      - $ref: "#/components/schemas/PaginationMeta"
                      - type: object
                        properties:
                          unread_count: { type: integer }
  /notifications/read_all:
    patch:
      operationId: readAllNotifications
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /notifications/{id}/read:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: readNotification
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /notifications/{id}/reply:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: replyToNotification
      description: Send an idempotent reply to an owned chat notification and acknowledge only its message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: object
                  required: [body, client_id]
                  properties:
                    body: { type: string, minLength: 1, maxLength: 4000 }
                    client_id: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "404": { description: Notification or conversation unavailable. }
        "422": { description: Invalid reply or notification type. }
  /mobile_sessions:
    get:
      operationId: listMobileSessions
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
  /mobile_sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: revokeMobileSession
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /impersonation:
    post:
      operationId: startImpersonation
      deprecated: true
      description: Employee impersonation is disabled. Use owner-approved read-only support access grants.
      responses:
        "410": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      operationId: stopImpersonation
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /mobile_device:
    put:
      operationId: registerMobileDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device]
              properties:
                device:
                  $ref: "#/components/schemas/MobileDeviceRegistration"
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
    delete:
      operationId: unregisterMobileDevice
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
  /realtime/token:
    post:
      operationId: createRealtimeToken
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
  /portfolio:
    get:
      security: []
      operationId: getPublishedPortfolio
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "404": { $ref: "#/components/responses/Error" }
  /demo/manifest:
    get:
      operationId: getDemoManifest
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
  /workspace_integrations:
    get:
      operationId: listWorkspaceIntegrations
      description: Owner/admin metadata only. Credentials are never returned.
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
  /workspace_integrations/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        schema: { type: string, enum: [google_sheets, slack] }
    put:
      operationId: replaceWorkspaceIntegration
      description: Replaces an encrypted workspace credential. Requires recent MFA.
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: revokeWorkspaceIntegration
      description: Revokes this workspace connection and removes its stored credential. Requires recent MFA.
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
  /uploads:
    post:
      operationId: createDirectUpload
      responses:
        "201":
          $ref: "#/components/responses/GenericSuccess"
  /uploads/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: uploadReservedBytes
      description: Send raw bytes with bearer authentication within 15 minutes of reservation. Size and MD5 must match.
      responses:
        "200": { description: Upload verified }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /file_access:
    post:
      operationId: createPrivateFileTicket
      description: Returns a five-minute download URL, bound to the current mobile session and reauthorized on every read.
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "404": { $ref: "#/components/responses/Error" }
  /pdf_documents:
    get:
      operationId: listPdfDocuments
      responses:
        "200":
          $ref: "#/components/responses/GenericSuccess"
    post:
      operationId: uploadPdfDocument
      responses:
        "201":
          $ref: "#/components/responses/GenericSuccess"
  /pdf_documents/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getPdfDocument
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    patch:
      operationId: renamePdfDocument
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    delete:
      operationId: deletePdfDocument
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /pdf_document_operations:
    post:
      operationId: createPdfOperation
      responses:
        "201":
          $ref: "#/components/responses/GenericSuccess"
        "202":
          $ref: "#/components/responses/GenericSuccess"
  /pdf_document_operations/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getPdfOperation
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /admin/tables:
    get:
      operationId: listAdminTables
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/meta/{table}:
    parameters:
      - name: table
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getAdminTableMetadata
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/{table}:
    parameters:
      - name: table
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listAdminRecords
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAdminRecord
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/{table}/{id}:
    parameters:
      - name: table
        in: path
        required: true
        schema: { type: string }
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateAdminRecord
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAdminRecord
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /admin/users/{id}/password:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: resetAdminUserPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: object
                  required: [password, password_confirmation]
                  properties:
                    password: { type: string, format: password, minLength: 6 }
                    password_confirmation: { type: string, format: password, minLength: 6 }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /portfolio_admin:
    get:
      operationId: getPortfolioAdmin
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Error" }
  /portfolio_admin/profile:
    patch:
      operationId: updatePortfolioProfile
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "422": { $ref: "#/components/responses/Error" }
  /portfolio_admin/projects:
    post:
      operationId: createPortfolioProject
      responses:
        "201": { $ref: "#/components/responses/GenericSuccess" }
        "422": { $ref: "#/components/responses/Error" }
  /portfolio_admin/projects/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updatePortfolioProject
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    delete:
      operationId: deletePortfolioProject
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
  /portfolio_admin/projects/{id}/features:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: createPortfolioFeature
      responses:
        "201": { $ref: "#/components/responses/GenericSuccess" }
  /portfolio_admin/features/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updatePortfolioFeature
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
    delete:
      operationId: deletePortfolioFeature
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
  responses:
    GenericSuccess:
      description: Normalized success response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GenericEnvelope"
    AuthSuccess:
      description: Mobile authentication session
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: "#/components/schemas/AuthSession"
    Error:
      description: Normalized error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ChatMessage:
      type: object
      required: [id, body, created_at]
      properties:
        id: { type: integer }
        client_id: { type: [string, 'null'] }
        body: { type: string }
        user_id: { type: integer }
        user_name: { type: string }
        user_profile_picture: { type: [string, 'null'] }
        message_type: { type: string, enum: [message, system] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        edited_at: { type: [string, 'null'], format: date-time }
        deleted_at: { type: [string, 'null'], format: date-time }
        pinned_at: { type: [string, 'null'], format: date-time }
        pinned_by_id: { type: [integer, 'null'] }
        editable_until: { type: [string, 'null'], format: date-time }
        reply_to_id: { type: [integer, 'null'] }
        reply_to:
          type: [object, 'null']
          properties:
            id: { type: integer }
            body: { type: string }
            user_id: { type: integer }
            user_name: { type: string }
            deleted_at: { type: [string, 'null'], format: date-time }
            updated_at: { type: string, format: date-time }
            attachment_count: { type: integer }
        attachments:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              filename: { type: string }
              url: { type: string }
              download_url: { type: string }
              content_type: { type: string }
              byte_size: { type: integer }
        reactions:
          type: object
          additionalProperties: { type: integer }
        reacted_emojis:
          type: array
          items: { type: string }

    GenericEnvelope:
      type: object
      required: [data]
      properties:
        data: {}
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        next_page: { type: [integer, "null"] }
        total_pages: { type: integer }
        total_count: { type: integer }
        per_page: { type: integer }
      additionalProperties: true
    ConversationReceipt:
      type: object
      required: [conversation_id, user_id]
      properties:
        conversation_id: { type: integer }
        user_id: { type: integer }
        delivered_message_id: { type: [integer, "null"] }
        read_message_id: { type: [integer, "null"] }
        delivered_at: { type: [string, "null"], format: date-time }
        read_at: { type: [string, "null"], format: date-time }
    ScheduledMeeting:
      type: object
      required:
      - id
      - title
      - starts_at
      - ends_at
      - organizer_id
      - can_manage
      - can_join
      - lock_version
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type:
          - string
          - 'null'
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - scheduled
          - canceled
          - completed
        call_type:
          type: string
          enum:
          - audio
          - video
        organizer_id:
          type: integer
        organizer_name:
          type: string
        can_manage:
          type: boolean
        can_join:
          type: boolean
        response:
          type: string
          enum:
          - invited
          - accepted
          - declined
        lock_version:
          type: integer
        public_id:
          type:
          - string
          - 'null'
          format: uuid
        invitations:
          type: array
          items:
            type: object
            properties:
              user_id:
                type: integer
              name:
                type: string
              response:
                type: string
    MeetingAdmission:
      type: object
      required:
      - admission_pending
      - call_session
      properties:
        admission_pending:
          type: boolean
          const: true
        call_session:
          "$ref": "#/components/schemas/CallSession"
    CallParticipant:
      type: object
      required: [user_id, name, status]
      properties:
        user_id: { type: integer }
        name: { type: string }
        status: { type: string }
        ring_acknowledged_at: { type: [string, "null"], format: date-time }
        joined_at: { type: [string, "null"], format: date-time }
        left_at: { type: [string, "null"], format: date-time }
        approved: { type: boolean }
        removed: { type: boolean }
    CallHistoryEntry:
      type: object
      required: [id, conversation_id, title, call_type, status, participant_status, direction, created_at, duration_seconds, can_callback, can_open_conversation]
      properties:
        id: { type: integer }
        conversation_id: { type: integer }
        title: { type: string }
        call_type: { type: string, enum: [audio, video] }
        status: { type: string, enum: [ringing, active, ended, missed, canceled, failed] }
        participant_status: { type: string, enum: [ringing, joined, declined, missed, left] }
        direction: { type: string, enum: [incoming, outgoing] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        duration_seconds: { type: integer, minimum: 0 }
        can_callback: { type: boolean }
        can_open_conversation: { type: boolean }
    CallSession:
      type: object
      required: [id, public_id, share_url, conversation_id, call_type, status, initiator_id, initiator_name, can_end, participants]
      properties:
        id: { type: integer }
        public_id: { type: string, format: uuid }
        share_url: { type: string, format: uri }
        conversation_id: { type: integer }
        call_type: { type: string, enum: [audio, video] }
        status: { type: string }
        initiator_id: { type: integer }
        initiator_name: { type: string }
        host_approval_required: { type: boolean }
        host_id: { type: integer }
        host_name: { type: string }
        can_end: { type: boolean }
        started_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        ended_reason: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }
        current_participant:
          oneOf:
            - $ref: "#/components/schemas/CallParticipant"
            - type: "null"
        participants:
          type: array
          items:
            $ref: "#/components/schemas/CallParticipant"
    LiveKitCredentials:
      type: object
      required: [server_url, participant_token, call_session]
      properties:
        server_url: { type: string, format: uri }
        participant_token: { type: string }
        call_session:
          $ref: "#/components/schemas/CallSession"
    WorkspaceMembership:
      type: object
      required: [id, workspace_id, status, roles]
      properties:
        id: { type: integer }
        workspace_id: { type: integer }
        user_id: { type: integer }
        name: { type: string }
        offboarded_at: { type: [string, "null"], format: date-time }
        status: { type: string, enum: [active, suspended] }
        roles:
          type: array
          items: { type: string }
    MfaStatus:
      type: object
      required: [required, enabled, verified, recent]
      properties:
        required: { type: boolean }
        enabled: { type: boolean }
        verified: { type: boolean }
        recent: { type: boolean }
    User:
      type: object
      required: [id, email, first_name, last_name, full_name, roles, workspace, permissions, features]
      properties:
        mfa: { $ref: "#/components/schemas/MfaStatus" }
        site_admin: { type: boolean }
        id: { type: integer }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        full_name: { type: string }
        job_title: { type: string }
        profile_picture: { type: [string, "null"] }
        demo_account: { type: boolean }
        roles:
          type: array
          items: { type: string }
        workspace_membership:
          $ref: "#/components/schemas/WorkspaceMembership"
        permissions:
          type: array
          items: { type: string }
        features:
          type: object
          additionalProperties: { type: boolean }
        workspace:
          type: object
          required: [id, name, slug]
          properties:
            id: { type: integer }
            name: { type: string }
            slug: { type: string }
        preferences:
          type: object
          additionalProperties: true
        push_notification_settings:
          $ref: "#/components/schemas/PushNotificationSettings"
    PushNotificationSettings:
      type: object
      required: [enabled, previews, categories, quiet_hours]
      properties:
        enabled: { type: boolean }
        previews: { type: boolean }
        categories:
          type: object
          required: [chat, audio_calls, video_calls, work, social, reminders]
          properties:
            chat: { type: boolean }
            audio_calls: { type: boolean }
            video_calls: { type: boolean }
            work: { type: boolean }
            social: { type: boolean }
            reminders: { type: boolean }
        quiet_hours:
          type: object
          required: [enabled, start, end, timezone, allow_calls]
          properties:
            enabled: { type: boolean }
            start: { type: string, pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$" }
            end: { type: string, pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$" }
            timezone: { type: string }
            allow_calls: { type: boolean }
    MobileDeviceRegistration:
      type: object
      required: [expo_push_token, platform, push_schema_version, app_variant]
      properties:
        expo_push_token: { type: string }
        platform: { type: string, enum: [android, ios] }
        device_identifier: { type: [string, "null"] }
        device_name: { type: [string, "null"] }
        app_version: { type: [string, "null"] }
        native_build_version: { type: [string, "null"] }
        push_schema_version: { type: integer, minimum: 1 }
        app_variant: { type: string, enum: [development, preview, production, legacy] }
    Notification:
      type: object
      required: [id, action, event_type, category, title, message, actor, created_at, notifiable_type, notifiable_id, deep_link]
      properties:
        id: { type: integer }
        action: { type: string }
        event_type: { type: string }
        category: { type: string, enum: [chat, audio_calls, video_calls, work, social, reminders] }
        title: { type: string }
        message: { type: string }
        actor:
          type: object
          required: [id, name]
          properties:
            id: { type: integer }
            name: { type: string }
            avatar_color: { type: [string, "null"] }
            profile_picture: { type: [string, "null"] }
        read_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        notifiable_type: { type: string }
        notifiable_id: { type: integer }
        deep_link: { type: string }
        group_key: { type: [string, "null"] }
    AuthSession:
      type: object
      required: [user, access_token, refresh_token, access_token_expires_at, refresh_token_expires_at]
      properties:
        user:
          $ref: "#/components/schemas/User"
        access_token: { type: string }
        refresh_token: { type: string }
        access_token_expires_at: { type: integer }
        refresh_token_expires_at: { type: integer }
        impersonating: { type: boolean }
    Project:
      type: object
      required: [id, name, status]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: [string, "null"] }
        status: { type: string }
        start_date: { type: [string, "null"], format: date }
        end_date: { type: [string, "null"], format: date }
        task_count: { type: integer }
        sprint_count: { type: integer }
        sheet_integration_enabled: { type: boolean }
        sheet_id: { type: [string, "null"] }
        issue_sheet_id: { type: [string, "null"] }
        issue_sheet_name: { type: [string, "null"] }
        qa_mode_enabled: { type: boolean }
        users:
          type: array
          items:
            type: object
            additionalProperties: true
    Task:
      type: object
      required: [id, title, type, status]
      properties:
        id: { type: integer }
        task_id: { type: [string, "null"] }
        title: { type: string }
        description: { type: [string, "null"] }
        type: { type: string }
        status: { type: string }
        priority: { type: [string, "null"] }
        start_date: { type: [string, "null"], format: date }
        end_date: { type: [string, "null"], format: date }
        estimated_hours: { type: [number, string, "null"] }
        project_id: { type: [integer, "null"] }
        sprint_id: { type: [integer, "null"] }
        task_url: { type: [string, "null"] }
        order: { type: [integer, "null"] }
        developer_id: { type: [integer, "null"] }
        assigned_to_user: { type: [integer, "null"] }
        qa_assigned: { type: [string, "null"] }
        internal_qa: { type: [string, "null"] }
        blocker: { type: boolean }
        demo: { type: boolean }
        swag_point: { type: [number, string, "null"] }
        story_point: { type: [number, string, "null"] }
        dev_hours: { type: [number, string, "null"] }
        code_review_hours: { type: [number, string, "null"] }
        dev_to_qa_hours: { type: [number, string, "null"] }
        qa_hours: { type: [number, string, "null"] }
        automation_qa_hours: { type: [number, string, "null"] }
        total_hours: { type: [number, string, "null"] }
    ProjectCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    TaskCollection:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
