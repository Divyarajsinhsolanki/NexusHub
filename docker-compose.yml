services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus_hub_production
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_hub_production"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        redis:
          address: redis:6379
        keys:
          ${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-dev-secret-change-me-32-characters-min}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    depends_on:
      redis:
        condition: service_healthy

  release:
    build: .
    env_file: .env
    command: ./bin/release
    environment: &app-environment
      DATABASE_URL: postgres://nexus:${POSTGRES_PASSWORD}@db:5432/nexus_hub_production
      REDIS_URL: redis://redis:6379/1
      RAILS_ENV: production
      RAILS_SERVE_STATIC_FILES: "true"
      AUTO_RELEASE: "false"
      DEPLOYMENT_TIER: production
      APP_REVISION: ${APP_REVISION:-unknown}
      BACKUP_RECEIPT_PATH: /backups/latest.json
      SEED_PORTFOLIO: ${SEED_PORTFOLIO:-true}
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      pre_release_backup:
        condition: service_completed_successfully
    volumes:
      - db-backups:/backups:ro
      - app-files:/rails/storage

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment: *app-environment
    command: ./bin/rails server -b 0.0.0.0
    volumes: [app-files:/rails/storage]
    depends_on:
      release:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "ruby -rnet/http -e 'u=URI(\"http://localhost:3000/up\"); r=Net::HTTP::Get.new(u); r[\"Host\"]=URI(ENV.fetch(\"BASE_URL\")).host; exit(Net::HTTP.start(u.host,u.port){|h| h.request(r)}.is_a?(Net::HTTPSuccess) ? 0 : 1)'"]
      interval: 20s
      timeout: 5s
      retries: 10

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment: *app-environment
    command: bundle exec sidekiq
    volumes: [app-files:/rails/storage]
    depends_on:
      release:
        condition: service_completed_successfully

  pdf_worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment: *app-environment
    command: bundle exec sidekiq -C config/sidekiq_pdf.yml
    volumes: [app-files:/rails/storage]
    mem_limit: 3g
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512m,mode=1777
    depends_on:
      release:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

  pre_release_backup:
    build: .
    env_file:
      - .env
      - ${BACKUP_ENV_FILE:-.env.backup}
    environment: &backup-environment
      REDIS_URL: redis://redis:6379/1
      RAILS_ENV: production
      DEPLOYMENT_TIER: production
      AUTO_RELEASE: "false"
      APP_REVISION: ${APP_REVISION:-unknown}
      BACKUP_DIRECTORY: /backups
      BACKUP_PUBLIC_KEY_FILE: /run/backup-recipient.asc
      BACKUP_UPLOAD_MODE: active_storage
    command: bundle exec rails recovery:prepare_release_backup
    volumes:
      - db-backups:/backups
      - app-files:/rails/storage:ro
      - ${BACKUP_PUBLIC_KEY_PATH:?Set BACKUP_PUBLIC_KEY_PATH}:/run/backup-recipient.asc:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  backup:
    build: .
    restart: unless-stopped
    env_file:
      - .env
      - ${BACKUP_ENV_FILE:-.env.backup}
    environment: *backup-environment
    volumes:
      - db-backups:/backups
      - app-files:/rails/storage:ro
      - ${BACKUP_PUBLIC_KEY_PATH:?Set BACKUP_PUBLIC_KEY_PATH}:/run/backup-recipient.asc:ro
    entrypoint: ["/bin/bash", "-c"]
    command: ["while true; do bundle exec rails recovery:backup || exit 1; sleep 86400; done"]
    depends_on:
      release:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "./bin/recovery", "check", "/backups/latest.json"]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 10m

volumes:
  app-files:
  db-data:
  redis-data:
  db-backups:
  caddy-data:
  caddy-config:
